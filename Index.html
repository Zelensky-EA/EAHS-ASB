<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASB Student Store</title>
<style>
:root{--ink:#173e36;--green:#17614d;--paper:#f4f6f1;--gold:#f4bd58;--line:#dce3dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#233c36;font:16px system-ui,sans-serif}header{background:var(--ink);color:white;padding:24px max(20px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:26px;margin:3px 0}header small{color:#bbd7ca;letter-spacing:2px}main{max-width:1200px;margin:auto;padding:24px 20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}button{border:0;border-radius:10px;padding:12px 17px;font:inherit;font-weight:650;cursor:pointer;background:var(--green);color:white}button.secondary,nav button{background:white;color:var(--ink);border:1px solid var(--line)}nav button.selected{background:var(--ink);color:white}button:disabled{opacity:.55;cursor:wait}input,select,textarea{width:100%;padding:12px;border:1px solid #bccbc2;border-radius:9px;font:inherit;background:white;color:#233c36}label{display:block;font-size:14px;font-weight:650;margin-bottom:5px}.field{margin-bottom:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric strong{display:block;font-size:30px;color:var(--ink);margin-top:8px}.metric{font-size:14px;color:#61736b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.toolbar{display:flex;gap:12px;margin-bottom:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:12px;text-transform:uppercase;color:#667970;letter-spacing:.6px}td,th{padding:13px 10px;border-bottom:1px solid var(--line)}td small{display:block;color:#667970}td input{min-width:85px;width:100px}.badge{display:inline-block;background:#fcebc9;color:#734b05;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700}.subtle{color:#65786e;font-size:14px}.notice{border-left:4px solid var(--gold);background:#fff8e9;padding:16px;border-radius:8px;margin:16px 0}#message{position:sticky;top:8px;z-index:5;padding:12px 16px;border-radius:10px;margin-bottom:16px;background:#e1f1e7;display:none}#message.error{background:#ffe5e0;color:#8d2a20}.login{max-width:450px;margin:6vh auto}h2{margin:0 0 10px;font-size:23px}h3{margin:0 0 15px}#identity{font-size:13px;text-align:right}summary{cursor:pointer;font-weight:650}pre{white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.total{font-size:23px;font-weight:750;margin:18px 0}.hidden{display:none!important}.scan-box{background:#eff5f0;border:1px solid var(--line);border-radius:12px;padding:16px;margin:18px 0}.scan-box .actions{margin:10px 0}#cameraReader{max-width:600px;margin:10px auto}#scanStatus{padding:10px;min-height:40px}#labels{display:none}@media print{body>*{display:none!important}#labels{display:block!important}#labels .label{display:inline-block;width:2.4in;padding:.12in;border:1px dashed #ccc;break-inside:avoid;text-align:center;font:12px system-ui}#labels svg{max-width:100%;height:55px}}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}main{padding:18px 12px}header{padding:20px 15px}h1{font-size:21px}.card{padding:16px}nav button{padding:10px 13px}.metric strong{font-size:25px}}
</style></head><body>
<header><div><small>STUDENT LED • ASB</small><h1>Student Store</h1></div><div id="identity">Inventory &amp; shift closeout</div></header>
<main><div id="message" role="status" aria-live="polite"></div>
<section id="login" class="card login"><h2>Ready for your shift?</h2><p class="subtle">Sign in with the store access code supplied by your adviser.</p><form id="loginForm"><div class="field"><label for="operator">Your name or shift team</label><input id="operator" required maxlength="80" autocomplete="name"></div><div class="field"><label for="code">Access code</label><input id="code" type="password" required autocomplete="current-password"></div><button type="submit">Open store</button></form><p class="subtle">Use your school Google account to open the deployed store.</p></section>
<section id="app" class="hidden"><nav id="nav"></nav><div id="content"></div></section></main><div id="labels"></div>
<script>
let camera=null,cameraStarting=false,scanHandler=null;
let session=null,data=null,tab='inventory',busy=false,requestId=null;
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v)||0);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function message(s,error=false){$('message').textContent=s;$('message').className=error?'error':'';$('message').style.display='block'}
function rpc(fn,...args){return new Promise((resolve,reject)=>{if(!window.google?.script?.run){reject(Error('Open this app using its deployed Google Apps Script URL.'));return}google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args)})}
async function task(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){message(e.message||String(e),true)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('loginForm').onsubmit=e=>{e.preventDefault();task(async()=>{session=await rpc('login',$('code').value,$('operator').value);$('code').value='';tab='inventory';await load();$('login').classList.add('hidden');$('app').classList.remove('hidden');message('Connected to shared inventory.');})};
async function load(){data=await rpc('getStore',session.token);$('identity').textContent=session.operator+' · '+data.role;render()}
function render(){const tabs=[['inventory','Inventory'],['sale','Close shift'],...(data.role==='adviser'?[['stock','Stock changes'],['products','Products'],['settings','Access codes']]:[]),['history','Activity']];$('nav').innerHTML=tabs.map(([id,title])=>`<button data-tab="${id}" class="${tab===id?'selected':''}">${title}</button>`).join('')+'<button id="refresh" class="secondary">Refresh</button><button id="signout" class="secondary">Sign out</button>';$('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>task(async()=>{await stopCamera();tab=b.dataset.tab;requestId=null;render()}));$('refresh').onclick=()=>task(async()=>{await stopCamera();await load()});$('signout').onclick=()=>task(async()=>{await stopCamera();await rpc('logout',session.token);session=null;data=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('identity').textContent='Inventory & shift closeout';message('Signed out.')});({inventory, sale:()=>movement('sale'),stock:()=>movement('restock'),products,history,settings})[tab]()}
function active(){return data.products.filter(p=>p.active)}
function productLabel(p){return `<strong>${esc(p.name)}</strong><small>${[p.size,p.color].filter(Boolean).map(esc).join(' · ')||esc(p.category)}</small>`}
function inventory(){const all=active(),low=all.filter(p=>p.stock<=p.reorder);$('content').innerHTML=`<div class="metrics">${[['Units on hand',all.reduce((n,p)=>n+p.stock,0)],['Low-stock variants',low.length],['Recorded sales',money(data.totals.revenue)],['Stock at cost',money(all.reduce((n,p)=>n+p.stock*p.cost,0))]].map(([a,b])=>`<div class="card metric">${a}<strong>${b}</strong></div>`).join('')}</div><div class="card"><h2>Your store inventory</h2><p class="subtle">Each size and color has its own stock count. Sales total covers all recorded shifts.</p><div class="toolbar"><input id="search" placeholder="Search products, sizes, colors, or SKU" aria-label="Search inventory"><select id="category" aria-label="Category"><option value="">All categories</option>${[...new Set(all.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="secondary" id="export">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU / location</th><th>Price</th><th>On hand</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
function rows(){const q=$('search').value.toLowerCase(),cat=$('category').value;$('rows').innerHTML=all.filter(p=>(!cat||p.category===cat)&&[p.name,p.sku,p.barcode,p.size,p.color,p.location].join(' ').toLowerCase().includes(q)).map(p=>`<tr><td>${productLabel(p)}</td><td>${esc(p.sku)}<small>${esc(p.location)}</small></td><td>${money(p.price)}</td><td><strong>${p.stock}</strong></td><td>${p.stock<=p.reorder?'<span class="badge">'+(p.stock===0?'Out of stock':'Reorder')+'</span>':'In stock'}</td></tr>`).join('')||'<tr><td colspan="5">No products yet. An adviser can add products and starting stock.</td></tr>'}rows();$('search').oninput=rows;$('category').onchange=rows;$('export').onclick=()=>csv('ASB-inventory.csv',[['SKU','Barcode','Product','Category','Size','Color','Location','Cost','Price','Stock','Reorder'],...all.map(p=>[p.sku,p.barcode||p.sku,p.name,p.category,p.size,p.color,p.location,p.cost,p.price,p.stock,p.reorder])]);}
function movement(type){requestId=requestId||crypto.randomUUID();const sale=type==='sale';$('content').innerHTML=`<div class="card"><h2>${sale?'Close out a shift':'Receive or correct stock'}</h2><p class="subtle">${sale?'Enter the total units sold for each item during this shift. Leave unsold items blank.':'Restocking adds units. Corrections use signed quantities: +3 adds three; -2 removes two.'}</p><form id="movement"><div class="grid"><div class="field"><label for="date">Date</label><input type="date" id="date" value="${today()}" required></div><div class="field"><label for="shift">${sale?'Shift name (unique for this date)':'Delivery or correction label'}</label><input id="shift" required maxlength="80" placeholder="${sale?'Lunch — team 1':'Opening count / delivery'}"></div></div>${scanPanel()}${!sale?'<div class="field"><label for="type">Stock change</label><select id="type"><option value="restock">Receive stock / starting inventory</option><option value="adjustment">Correction / damage / return</option></select></div>':''}<div class="table-wrap"><table><thead><tr><th>Product</th><th>On hand</th><th>Price</th><th>${sale?'Units sold':'Units to add / remove'}</th></tr></thead><tbody>${active().map(p=>`<tr><td>${productLabel(p)}<small>${esc(p.sku)}</small></td><td>${p.stock}</td><td>${money(p.price)}</td><td><input class="qty" data-id="${esc(p.id)}" type="number" step="1" ${sale?'min="0"':''} placeholder="0" aria-label="Quantity for ${esc([p.name,p.size,p.color].join(' '))}"></td></tr>`).join('')||'<tr><td colspan="4">Add products before entering stock or sales.</td></tr>'}</tbody></table></div>${sale?'<div class="total" id="expected">Expected sales: $0.00</div><div class="grid"><div class="field"><label for="cash">Cash collected for sales</label><input id="cash" type="number" min="0" step=".01" value="0" required></div><div class="field"><label for="electronic">Electronic payments collected</label><input id="electronic" type="number" min="0" step=".01" value="0" required></div></div><p class="subtle">Exclude the starting cash float. Amounts are recorded only; this app does not process payments.</p><p id="variance"></p>':''}<div class="field"><label for="note">Notes ${sale?'(discounts or cash differences)':'(required for corrections)'}</label><textarea id="note" maxlength="500" rows="2"></textarea></div><button type="submit">${sale?'Review and save shift':'Save stock change'}</button></form></div>`;
setupScanner(code=>{const product=lookup(code);if(!product){scanNotice('Unknown barcode: '+code+'. An adviser must add or assign this code in Products.',true);return}if(!product.active){scanNotice('This product is inactive.',true);return}const e=[...document.querySelectorAll('.qty')].find(e=>e.dataset.id===product.id);const delta=Number($('scanQty').value);if(!Number.isSafeInteger(delta)||delta===0||(sale&&delta<0)||(!sale&&$('type').value==='restock'&&delta<0)){scanNotice('Enter a valid units-per-scan quantity.',true);return}const qty=Number(e.value||0)+delta;if((sale&&qty>product.stock)||(!sale&&product.stock+qty<0)){scanNotice('This scan exceeds available stock.',true);return}e.value=qty;e.dispatchEvent(new Event('input'));scanNotice([product.name,product.size,product.color].filter(Boolean).join(' · ')+' — '+qty+' units entered. Review and save to update shared stock.');e.closest('tr').style.background='#e1f1e7';});
if(sale){function total(){const t=[...document.querySelectorAll('.qty')].reduce((s,e)=>s+Number(e.value||0)*data.products.find(p=>p.id===e.dataset.id).price,0);$('expected').textContent='Expected sales: '+money(t);$('variance').textContent='Collected minus expected: '+money(Number($('cash').value||0)+Number($('electronic').value||0)-t)}document.querySelectorAll('.qty,#cash,#electronic').forEach(e=>e.oninput=total);total()}
$('movement').onsubmit=e=>{e.preventDefault();const lines=[...document.querySelectorAll('.qty')].filter(e=>e.value&&Number(e.value)!==0).map(e=>({id:e.dataset.id,qty:Number(e.value)}));if(!lines.length){message('Enter at least one item quantity.',true);return}const input={request:requestId,type:sale?'sale':$('type').value,date:$('date').value,shift:$('shift').value,note:$('note').value,lines,cash:sale?$('cash').value:0,electronic:sale?$('electronic').value:0};if(!confirm(`Save ${input.type} for ${input.shift}?\n${lines.reduce((s,x)=>s+Math.abs(x.qty),0)} units across ${lines.length} items.\n${sale?$('expected').textContent+'\n'+$('variance').textContent:''}`))return;task(async()=>{await stopCamera();await rpc('submitMovement',session.token,input);requestId=null;await load();message('Saved. Shared inventory is updated.');})};}
function products(){const all=data.products;$('content').innerHTML=`<div class="card"><h2>Manage products</h2><p class="subtle">Create one product per size and color. Add quantities through Stock changes after saving.</p><div class="field"><label for="edit">Product to edit</label><select id="edit"><option value="">Create new product</option>${all.map(p=>`<option value="${esc(p.id)}">${esc([p.name,p.size,p.color].filter(Boolean).join(' · '))}${p.active?'':' (inactive)'}</option>`).join('')}</select></div>${scanPanel()}<div class="actions"><button type="button" id="printLabels" class="secondary">Print barcode labels</button></div><p class="subtle">Select a product or scan its code to edit. For a new code, enter the product details below.</p><form id="product"><div class="grid">${[['barcode','UPC / supplier barcode (optional)','text'],['name','Product name','text'],['category','Category','text'],['size','Size','text'],['color','Color','text'],['location','Storage location','text'],['cost','Unit cost ($)','number'],['price','Selling price ($)','number'],['reorder','Reorder at or below','number']].map(([id,l,t])=>`<div class="field"><label for="p_${id}">${l}</label><input id="p_${id}" type="${t}" ${t==='number'?`min="0" step="${id==='reorder'?'1':'.01'}" value="0"`:''} ${['name','category','cost','price','reorder'].includes(id)?'required':''}></div>`).join('')}</div><div class="field"><label for="p_active">Availability</label><select id="p_active"><option value="true">Active</option><option value="false">Inactive (keep history)</option></select></div><button>Save product</button></form></div>`;$('edit').onchange=()=>{const p=all.find(p=>p.id===$('edit').value);['barcode','name','category','size','color','location','cost','price','reorder'].forEach(k=>$('p_'+k).value=p?(p[k]??''):(['cost','price','reorder'].includes(k)?0:''));$('p_active').value=p?String(p.active):'true'};setupScanner(code=>{const match=lookup(code);$('edit').value=match?match.id:'';$('edit').onchange();$('p_barcode').value=match?(match.barcode||''):code;scanNotice(match?'Product selected. Edit details below.':'New barcode captured. Enter product details, save, then receive stock.');});$('printLabels').onclick=()=>task(printLabels);$('product').onsubmit=e=>{e.preventDefault();const item={id:$('edit').value,active:$('p_active').value==='true'};['barcode','name','category','size','color','location','cost','price','reorder'].forEach(k=>item[k]=$('p_'+k).value);task(async()=>{await stopCamera();await rpc('saveProduct',session.token,item);await load();message('Product saved. Use Stock changes to enter quantities.')})};}
function history(){const logs=data.logs;$('content').innerHTML=`<div class="card"><div class="actions"><h2>Activity &amp; shift reports</h2><button id="report" class="secondary">Export shift report</button></div><p class="subtle">Latest 200 entries. Complete history remains in the adviser’s spreadsheet. Recorded operator names are entered by the team.</p>${logs.map(l=>`<details class="card"><summary>${esc(l.details.date||l.timestamp.slice(0,10))} · ${esc(l.type)} · ${esc(l.details.shift||l.details.name||'Product change')}</summary><p class="subtle">${esc(l.operator)} · ${esc(l.timestamp)}</p>${l.type==='sale'?`<p>Expected: <strong>${money(l.details.revenue)}</strong> · Cash: ${money(l.details.cash)} · Electronic: ${money(l.details.electronic)} · Difference: ${money(l.details.variance)}</p>`:''}${l.details.lines?`<ul>${l.details.lines.map(x=>`<li>${esc([x.name,x.size,x.color].filter(Boolean).join(' · '))}: ${x.delta>0?'+':''}${x.delta}</li>`).join('')}</ul>`:'<p>Product settings updated.</p>'}<p>${esc(l.details.note||'')}</p></details>`).join('')||'<p>No activity yet.</p>'}</div>`;$('report').onclick=()=>csv('ASB-recent-shifts.csv',[['Date','Shift','Operator','Units sold','Expected revenue','Cash','Electronic','Difference','Notes'],...logs.filter(l=>l.type==='sale').map(l=>[l.details.date,l.details.shift,l.operator,l.details.lines.reduce((s,x)=>s-x.delta,0),l.details.revenue,l.details.cash,l.details.electronic,l.details.variance,l.details.note])]);}
function csv(name,rows){const text=rows.map(r=>r.map(v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function scanPanel(){return `<section class="scan-box"><h3>Barcode scanner</h3><div class="grid"><div><label for="scanCode">USB scanner or manual barcode</label><input id="scanCode" autocomplete="off" placeholder="Scan here, then Enter"></div><div><label for="scanQty">Units per scan</label><input id="scanQty" type="number" step="1" value="1"></div></div><div class="actions"><button id="scanAdd" type="button">Use barcode</button><button id="cameraStart" type="button" class="secondary">Phone camera</button><button id="cameraStop" type="button" class="secondary">Stop camera</button><label class="secondary" style="cursor:pointer">Scan barcode photo<input id="scanPhoto" type="file" accept="image/*" capture="environment" style="display:none"></label></div><p class="subtle">Camera scans pause after each match. Tap “Scan next” for the next item, including another copy of the same item. USB scans add the chosen quantity each time. Nothing is saved until you submit the form.</p><div id="cameraReader"></div><button type="button" id="scanNext" class="secondary hidden">Scan next</button><div id="scanStatus" role="status" aria-live="polite"></div></section>`}
function scanNotice(text,error=false){const e=$('scanStatus');if(e){e.textContent=text;e.style.color=error?'#982e20':'#173e36'}}
function barcodeKey(value){const s=String(value||'').trim();return /^0\d{12}$/.test(s)?s.slice(1):s}
function lookup(code){return data.products.find(p=>[p.sku,p.barcode].filter(Boolean).some(v=>barcodeKey(v)===barcodeKey(code)))}
function library(url,global){if(window[global])return Promise.resolve();return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=()=>window[global]?resolve():reject(Error('Scanner library did not load.'));s.onerror=()=>{s.remove();reject(Error('Scanner library is blocked. Use a USB scanner or type the barcode.'))};document.head.appendChild(s)})}
async function stopCamera(){if(cameraStarting)throw Error('Wait for the camera to finish starting.');if(camera){const current=camera;if(current.isScanning)await current.stop();current.clear();camera=null}if($('scanNext'))$('scanNext').classList.add('hidden')}
function setupScanner(handler){scanHandler=handler;const use=code=>{if(busy)return;code=String(code||'').trim();if(!code){scanNotice('Scan or enter a barcode.',true);return}handler(code);$('scanCode').value='';$('scanCode').focus()};$('scanCode').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();use(e.target.value)}};$('scanAdd').onclick=()=>use($('scanCode').value);$('cameraStop').onclick=()=>task(stopCamera);$('scanNext').onclick=()=>{if(camera?.isScanning){camera.resume();$('scanNext').classList.add('hidden');scanNotice('Ready for the next barcode.')}};
$('cameraStart').onclick=()=>task(async()=>{await stopCamera();await library('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js','Html5Qrcode');camera=new Html5Qrcode('cameraReader');cameraStarting=true;try{await camera.start({facingMode:'environment'},{fps:8},code=>{if(busy)return;camera.pause(true);$('scanNext').classList.remove('hidden');use(code)},()=>{});scanNotice('Camera ready. Hold the barcode steady in good light.')}catch(e){camera.clear();camera=null;throw Error('Camera unavailable or permission denied. Use “Scan barcode photo”, a USB scanner, or manual entry.')}finally{cameraStarting=false}});
$('scanPhoto').onchange=e=>{const file=e.target.files[0];if(!file)return;task(async()=>{await stopCamera();await library('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js','Html5Qrcode');camera=new Html5Qrcode('cameraReader');try{const code=await camera.scanFile(file,true);handler(code);$('scanCode').value=''}catch(e){throw Error('No readable barcode found. Try a sharp, well-lit photo or type the code.')}finally{camera.clear();camera=null;e.target.value=''}})};
}
async function printLabels(){await stopCamera();await library('https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js','JsBarcode');const selected=$('edit').value,items=selected?data.products.filter(p=>p.id===selected):active();if(!items.length)throw Error('Add a product first.');const count=Number(prompt('Copies per product (1–100):','1'));if(!Number.isInteger(count)||count<1||count>100)return;const root=$('labels');root.replaceChildren();for(const p of items){for(let n=0;n<count;n++){const d=document.createElement('div');d.className='label';const title=document.createElement('strong');title.textContent=[p.name,p.size,p.color].filter(Boolean).join(' · ');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),price=document.createElement('div');price.textContent=money(p.price);d.append(title,svg,price);root.append(d);JsBarcode(svg,p.barcode||p.sku,{format:'CODE128',width:1.5,height:45,margin:6,fontSize:12})}}window.print()}
function settings(){$('content').innerHTML=`<div class="card"><h2>Change store access codes</h2><p>Choose your own student and adviser codes. Each must be at least 10 characters, and the two codes must differ.</p><p class="subtle">Leave a field blank to keep that code. Saving signs everyone out, including you. Keep your new adviser code before saving.</p><form id="codes"><div class="field"><label for="newStudent">New student code</label><input id="newStudent" type="password" autocomplete="new-password" minlength="10"></div><div class="field"><label for="confirmStudent">Confirm student code</label><input id="confirmStudent" type="password" autocomplete="new-password"></div><div class="field"><label for="newAdviser">New adviser code</label><input id="newAdviser" type="password" autocomplete="new-password" minlength="10"></div><div class="field"><label for="confirmAdviser">Confirm adviser code</label><input id="confirmAdviser" type="password" autocomplete="new-password"></div><button>Save new codes</button></form></div>`;$('codes').onsubmit=e=>{e.preventDefault();const student=$('newStudent').value,adviser=$('newAdviser').value;if(student!==$('confirmStudent').value||adviser!==$('confirmAdviser').value){message('Confirmation does not match.',true);return}task(async()=>{await rpc('changeAccessCodes',session.token,{student,adviser});session=null;data=null;$('content').replaceChildren();$('app').classList.add('hidden');$('login').classList.remove('hidden');$('identity').textContent='Inventory & shift closeout';message('Codes changed. Sign in using the new code.');})};}
